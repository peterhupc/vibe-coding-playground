<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>點擊計數器</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --ink: #1c1917;
    --muted: #78716c;
    --accent: #6366f1;
    --pos: #16a34a;
    --neg: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 48px 56px;
    text-align: center;
    width: 360px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .count {
    font-size: 88px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    transition: transform 0.08s ease;
    margin-bottom: 28px;
  }
  .count.pos { color: var(--pos); }
  .count.neg { color: var(--neg); }
  .count.bump { transform: scale(1.1); }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btns .row { display: flex; gap: 12px; width: 100%; }
  button {
    border: none;
    border-radius: 12px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.06s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.94); }
  .minus { flex: 1; background: #fef2f2; color: var(--neg); }
  .plus  { flex: 1; background: #f0fdf4; color: var(--pos); }
  .reset { flex: 1; background: #eef2ff; color: var(--accent); }
  button:hover { filter: brightness(0.97); }
</style>
</head>
<body>
  <div class="card">
    <h1>點擊計數器</h1>
    <p class="sub">按「＋」或「－」，點 Reset 歸零</p>
    <div class="count" id="count">0</div>
    <div class="btns">
      <div class="row">
        <button class="minus" id="minus">－</button>
        <button class="plus" id="plus">＋</button>
        <button class="reset" id="reset">Reset</button>
      </div>
      <div class="row">
        <button class="minus" id="minus5">－５</button>
        <button class="plus" id="plus5">＋５</button>
      </div>
    </div>
  </div>

<script>
  let value = 0;
  let holdTimer = null;
  let holdInterval = null;
  const el = document.getElementById('count');
  const bump = () => {
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 100);
  };
  const render = () => {
    el.textContent = value;
    el.classList.toggle('pos', value > 0);
    el.classList.toggle('neg', value < 0);
  };
  const change = (by) => {
    value += by;
    bump();
    render();
  };
  const addBy = (btnId, by) => {
    const btn = document.getElementById(btnId);
    btn.addEventListener('mousedown', () => {
      change(by);
      holdTimer = setTimeout(() => {
        holdInterval = setInterval(() => change(by), 80);
      }, 350);
    });
    const stop = () => {
      clearTimeout(holdTimer);
      clearInterval(holdInterval);
    };
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);
  };
  addBy('plus', 1);
  addBy('minus', -1);
  addBy('plus5', 5);
  addBy('minus5', -5);
  document.getElementById('reset').addEventListener('click', () => { value = 0; bump(); render(); });
  render();
</script>
</body>
</html>
