<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日習慣追蹤器</title>
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --ink: #1c1917;
    --muted: #78716c;
    --accent: #6366f1;
    --done: #a8a29e;
    --row: #fafaf9;
    --row-border: #f5f5f4;
    --soft: #eef2ff;
    --input-border: #e7e5e4;
    --cell: #f5f5f4;
    --cell-done: #86efac;
    --cell-today: #c7d2fe;
    --streak: #ea580c;
    --warn: #f59e0b;
  }
  body.dark {
    --bg: #1c1917;
    --card: #292524;
    --ink: #fafaf9;
    --muted: #a8a29e;
    --accent: #818cf8;
    --done: #57534e;
    --row: #33302e;
    --row-border: #44403c;
    --soft: #312e81;
    --input-border: #44403c;
    --cell: #44403c;
    --cell-done: #15803d;
    --cell-today: #4338ca;
    --streak: #fb923c;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    transition: background 0.3s, color 0.3s;
  }
  .wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 20px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 22px; }
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 28px;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.06s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.94); }
  .btn-theme { background: var(--soft); color: var(--accent); }
  .btn-add { background: var(--accent); color: #fff; padding: 12px 20px; }

  .add-row { display: flex; gap: 10px; margin-bottom: 8px; }
  #habit-name {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid var(--input-border);
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    background: var(--card);
    color: var(--ink);
  }
  #habit-name:focus { border-color: var(--accent); }
  .emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .emoji-picker button {
    background: var(--cell);
    font-size: 20px;
    padding: 6px 10px;
    border-radius: 10px;
  }
  .emoji-picker button.active { outline: 3px solid var(--accent); }

  .habit {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--row);
    border-radius: 14px;
    border: 1px solid var(--row-border);
    margin-bottom: 10px;
  }
  .habit .emoji { font-size: 26px; width: 34px; text-align: center; }
  .habit .name { flex: 1; font-size: 16px; word-break: break-word; }
  .habit .streak {
    font-size: 13px;
    font-weight: 700;
    color: var(--streak);
    background: color-mix(in srgb, var(--streak) 12%, transparent);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .grid { display: flex; gap: 4px; }
  .grid .cell {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--cell);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    border: none;
    padding: 0;
    transition: background 0.15s;
  }
  .grid .cell:hover { filter: brightness(1.1); }
  .grid .cell.done { background: var(--cell-done); }
  .grid .cell.today { outline: 2px solid var(--cell-today); }
  .grid .cell .dot { color: #166534; font-weight: 700; }
  body.dark .grid .cell.done .dot { color: #bbf7d0; }
  .day-heads { display: flex; gap: 4px; margin: 0 0 6px 46px; }
  .day-heads span {
    width: 30px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }
  .habit .del {
    background: none;
    color: var(--danger, #dc2626);
    font-size: 16px;
    padding: 4px 8px;
  }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 12px 0; }

  /* 統計圖表 */
  .stats-title { font-size: 16px; margin-bottom: 6px; }
  .stats-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 160px;
    padding: 0 4px;
  }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .chart .bar-wrap { width: 100%; max-width: 42px; height: 100%; display: flex; align-items: flex-end; }
  .chart .bar {
    width: 100%;
    border-radius: 8px 8px 4px 4px;
    background: var(--accent);
    min-height: 4px;
    transition: height 0.4s ease;
    position: relative;
  }
  .chart .bar.low { background: var(--warn); }
  .chart .bar.zero { background: var(--cell); }
  .chart .bar .pct {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
  }
  .chart .day-label { font-size: 11px; color: var(--muted); }
  .chart .day-label.today { font-weight: 700; color: var(--accent); }
  .chart-note { font-size: 12px; color: var(--muted); margin-top: 14px; }

  /* RWD：手機 */
  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    .card { padding: 20px 16px; }
    h1 { font-size: 18px; }
    .habit { flex-wrap: wrap; gap: 8px; }
    .habit .name { flex-basis: calc(100% - 120px); }
    .habit .streak { order: 3; }
    .grid { order: 4; width: 100%; justify-content: space-between; }
    .grid .cell { width: calc((100vw - 120px) / 7); max-width: 38px; height: 34px; }
    .day-heads { margin-left: 0; }
    .day-heads span { width: calc((100vw - 120px) / 7); max-width: 38px; }
    .chart { height: 140px; gap: 6px; }
    .emoji-picker button { font-size: 17px; padding: 5px 8px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>📈 每日習慣追蹤器</h1>
      <button class="btn-theme" id="btn-theme">🌙 深色</button>
    </div>

    <div class="card">
      <div class="add-row">
        <input type="text" id="habit-name" placeholder="輸入習慣名稱，如：喝 8 杯水">
        <button class="btn-add" id="btn-add">新增</button>
      </div>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>

    <div class="card" id="stats-card">
      <div class="stats-title">📊 本週達成率</div>
      <div class="stats-sub" id="stats-sub"></div>
      <div class="chart" id="chart"></div>
      <div class="chart-note">每天達成率 = 當天勾選的習慣數 ÷ 習慣總數</div>
    </div>

    <div class="card">
      <div class="day-heads" id="day-heads"></div>
      <div id="habit-list"></div>
      <div class="empty" id="empty">還沒有習慣，先新增一個吧</div>
    </div>
  </div>

<script>
  /* ===== 深色模式 ===== */
  const applyTheme = (dark) => {
    document.body.classList.toggle('dark', dark);
    document.getElementById('btn-theme').textContent = dark ? '☀️ 淺色' : '🌙 深色';
    localStorage.setItem('habit-theme', dark ? 'dark' : 'light');
  };
  applyTheme(localStorage.getItem('habit-theme') === 'dark');
  document.getElementById('btn-theme').addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark'));
  });

  /* ===== 日期 ===== */
  const dstr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    days.push(d);
  }
  const todayStr = dstr(today);
  const wd = ['日', '一', '二', '三', '四', '五', '六'];

  const dayHeads = document.getElementById('day-heads');
  days.forEach((d, i) => {
    const s = document.createElement('span');
    const todayMark = dstr(d) === todayStr ? '今' : wd[d.getDay()];
    s.textContent = i === 6 ? '今' : todayMark;
    dayHeads.appendChild(s);
  });

  /* ===== 資料：habits = [{ name, emoji, done: { "YYYY-MM-DD": true } }] ===== */
  const STORAGE_KEY = 'habit-tracker';
  let habits = [];
  try { habits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { habits = []; }

  const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));

  const calcStreak = (h) => {
    let streak = 0;
    let d = new Date(today);
    if (!h.done[dstr(d)]) d.setDate(d.getDate() - 1); /* 今天還沒勾就從昨天起算 */
    while (h.done[dstr(d)]) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  };

  const habitList = document.getElementById('habit-list');
  const empty = document.getElementById('empty');

  const renderStats = () => {
    const chart = document.getElementById('chart');
    const sub = document.getElementById('stats-sub');
    chart.innerHTML = '';
    if (habits.length === 0) {
      sub.textContent = '新增習慣後，這裡會顯示每日達成率圖表';
      return;
    }
    sub.textContent = `共 ${habits.length} 個習慣 · 最近 7 天`;
    let totalRate = 0;
    days.forEach((d, di) => {
      const key = dstr(d);
      let doneCount = 0;
      habits.forEach((h) => { if (h.done[key]) doneCount++; });
      const rate = Math.round((doneCount / habits.length) * 100);
      totalRate += rate;

      const col = document.createElement('div');
      col.className = 'col';
      const wrap = document.createElement('div');
      wrap.className = 'bar-wrap';
      const bar = document.createElement('div');
      bar.className = 'bar' + (rate === 0 ? ' zero' : rate < 50 ? ' low' : '');
      bar.style.height = `${Math.max(rate, 4)}%`;
      const pct = document.createElement('span');
      pct.className = 'pct';
      pct.textContent = `${rate}%`;
      bar.appendChild(pct);
      wrap.appendChild(bar);
      const label = document.createElement('span');
      label.className = 'day-label' + (key === todayStr ? ' today' : '');
      label.textContent = di === 6 ? '今' : wd[d.getDay()];
      col.append(wrap, label);
      chart.appendChild(col);
    });
  };

  const render = () => {
    renderStats();
    habitList.innerHTML = '';
    habits.forEach((h, hi) => {
      const row = document.createElement('div');
      row.className = 'habit';
      const emoji = document.createElement('span');
      emoji.className = 'emoji';
      emoji.textContent = h.emoji || '📌';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = h.name;
      const grid = document.createElement('div');
      grid.className = 'grid';
      days.forEach((d, di) => {
        const key = dstr(d);
        const cell = document.createElement('button');
        cell.className = 'cell';
        cell.title = `${wd[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`;
        if (key === todayStr) cell.classList.add('today');
        if (h.done[key]) {
          cell.classList.add('done');
          const dot = document.createElement('span');
          dot.className = 'dot';
          dot.textContent = '✓';
          cell.appendChild(dot);
        }
        cell.addEventListener('click', () => {
          if (h.done[key]) delete h.done[key];
          else h.done[key] = true;
          save();
          render();
        });
        grid.appendChild(cell);
      });
      const streak = document.createElement('span');
      streak.className = 'streak';
      const n = calcStreak(h);
      streak.textContent = `🔥 ${n} 天`;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = '刪除習慣';
      del.addEventListener('click', () => {
        habits.splice(hi, 1);
        save();
        render();
      });
      row.append(emoji, name, streak, grid, del);
      habitList.appendChild(row);
    });
    empty.style.display = habits.length ? 'none' : 'block';
  };

  /* ===== Emoji 選擇 ===== */
  const EMOJIS = ['💧', '🏃', '📖', '🧘', '💪', '🥗', '😴', '✍️', '🦷', '📵'];
  let selectedEmoji = '💧';
  const picker = document.getElementById('emoji-picker');
  EMOJIS.forEach((e) => {
    const b = document.createElement('button');
    b.textContent = e;
    if (e === selectedEmoji) b.classList.add('active');
    b.addEventListener('click', () => {
      selectedEmoji = e;
      picker.querySelectorAll('button').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
    });
    picker.appendChild(b);
  });

  const input = document.getElementById('habit-name');
  const addHabit = () => {
    const n = input.value.trim();
    if (!n) return;
    habits.push({ name: n, emoji: selectedEmoji, done: {} });
    save();
    render();
    input.value = '';
    input.focus();
  };
  document.getElementById('btn-add').addEventListener('click', addHabit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addHabit(); });

  render();
</script>
</body>
</html>
